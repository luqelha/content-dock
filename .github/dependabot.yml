version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ["@nestjs/*"]
        update-types: [minor, patch]
      next-react:
        patterns:
          [
            "next",
            "eslint-config-next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
          ]
        update-types: [minor, patch]
      tiptap:
        patterns: ["@tiptap/*"]
        update-types: [minor, patch]
      prisma:
        patterns: ["prisma", "@prisma/client"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web-admin]
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
