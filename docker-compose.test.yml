services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: contentdock_test
      POSTGRES_PASSWORD: contentdock_test
      POSTGRES_DB: contentdock_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentdock_test -d contentdock_test"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["127.0.0.1:55672:5672"]
