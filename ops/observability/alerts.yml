groups:
  - name: contentdock-operational
    interval: 15s
    rules:
      - alert: ContentDockApiUnavailable
        expr: up{job="contentdock-api"} == 0 or absent(up{job="contentdock-api"})
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: ContentDock metrics/liveness target is unavailable
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#api-unavailable
      - alert: ContentDockDependencyUnavailable
        expr: contentdock_dependency_up{dependency=~"database|redis|broker|consumer|storage"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: ContentDock dependency is unavailable
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#dependency-outage
      - alert: ContentDockProbeStale
        expr: time() - contentdock_dependency_last_check_timestamp_seconds{dependency=~"database|redis|storage"} > 45
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Dependency telemetry is stale
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#stale-telemetry
      - alert: ContentDockExportBacklog
        expr: (time() - contentdock_export_oldest_pending_timestamp_seconds > 120) and (contentdock_export_oldest_pending_timestamp_seconds > 0)
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Export jobs are not progressing
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#export-backlog
      - alert: ContentDockExpiredLease
        expr: contentdock_export_expired_leases > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Export lease recovery is overdue
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#export-backlog
      - alert: ContentDockDispatcherStalled
        expr: time() - contentdock_export_dispatch_last_tick_timestamp_seconds > 90
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: Export dispatcher has stopped polling
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#export-backlog
      - alert: ContentDockExportFailures
        expr: sum by (job, instance) (increase(contentdock_export_worker_total{outcome=~"failed|retry"}[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: Export deliveries have failed or require recovery
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#export-backlog
      - alert: ContentDockVaultSpaceLow
        expr: contentdock_vault_available_bytes / contentdock_vault_size_bytes < 0.1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: Vault filesystem has less than ten percent available
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#vault-space
      - alert: ContentDockHttpErrors
        expr: (sum by (job, instance) (rate(contentdock_http_requests_total{status_class="5xx"}[5m])) / sum by (job, instance) (rate(contentdock_http_requests_total[5m])) > 0.05) and (sum by (job, instance) (increase(contentdock_http_requests_total[5m])) > 20)
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: HTTP server errors exceed five percent
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#http-errors-or-latency
      - alert: ContentDockHttpLatency
        expr: histogram_quantile(0.95, sum by (job, instance, le) (rate(contentdock_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: HTTP p95 exceeds two seconds
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#http-errors-or-latency
      - alert: ContentDockRetentionErrors
        expr: increase(contentdock_retention_errors_total[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: Vault retention inventory or cleanup failed
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#vault-space
      - alert: ContentDockBrokerExporterUnavailable
        expr: up{job="rabbitmq"} == 0 or absent(up{job="rabbitmq"})
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: RabbitMQ exporter is unavailable
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#dependency-outage
      - alert: ContentDockBrokerNoConsumers
        expr: rabbitmq_queue_consumers == 0 and rabbitmq_queue_messages_ready > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Broker has queued messages without consumers
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#export-backlog
      - alert: ContentDockAlertDeliveryFailed
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Alertmanager cannot deliver notifications
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#alert-delivery
      - alert: ContentDockAlertmanagerUnavailable
        expr: up{job="alertmanager"} == 0 or absent(up{job="alertmanager"})
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Alertmanager is unavailable
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#alert-delivery
      - alert: ContentDockAlertJournalUnavailable
        expr: up{job="alert-journal"} == 0 or absent(up{job="alert-journal"})
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Durable local alert receiver is unavailable
          runbook: docs/improvements/phase-4/OPERATIONAL-RUNBOOKS.md#alert-delivery
