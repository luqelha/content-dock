global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: atlas
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: atlas-api
    scrape_timeout: 5s
    static_configs:
      - targets: [api:9091]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alert-journal
    static_configs:
      - targets: [alert-journal:9099]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
