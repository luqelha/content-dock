events { worker_connections 1024; }
http {
    map $proxy_protocol_addr $atlas_client_ip {
        "" $remote_addr;
        default $proxy_protocol_addr;
    }
    # Port 81 is exclusively the private TLS-terminating Caddy upstream.
    map $server_port $atlas_forwarded_proto {
        81 https;
        default $scheme;
    }
    limit_req_zone $atlas_client_ip zone=auth:10m rate=10r/m;
    upstream atlas_api { server api:4000; }
    upstream atlas_web { server web:3000; }
    server {
        listen 80;
        # Private Caddy upstream only; this port is never published to the host.
        listen 81 proxy_protocol;
        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $atlas_client_ip;
        proxy_set_header X-Forwarded-For $atlas_client_ip;
        proxy_set_header X-Atlas-Client-IP $atlas_client_ip;
        proxy_set_header X-Forwarded-Proto $atlas_forwarded_proto;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location ~* ^/api/auth/(login|register)/?$ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://atlas_api;
        }
        location /api/files/ { proxy_pass http://atlas_web; }
        location /api/exports/ { proxy_pass http://atlas_web; proxy_buffering off; }
        location /api/ { proxy_pass http://atlas_api; proxy_buffering off; }
        location / { proxy_pass http://atlas_web; proxy_buffering off; }
    }
}
