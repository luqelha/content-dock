services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: atlas-api:1.0.0
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlas}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: atlas-api:1.0.0
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_APP_URL:?Set DATABASE_APP_URL to the provisioned non-owner atlas_app role}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-atlas}:${RABBITMQ_PASS:?Set RABBITMQ_PASS}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?Set a separate AUTH_PROXY_SECRET for web-to-API authentication}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set STORAGE_ENCRYPTION_KEY}
      STORAGE_RETENTION_ENABLED: ${STORAGE_RETENTION_ENABLED:-false}
      STORAGE_RETENTION_DRY_RUN: ${STORAGE_RETENTION_DRY_RUN:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      QUEUE_NAME: atlas_exports
      TRUST_PROXY: "1"
    volumes: [api_storage:/app/apps/api/storage]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  web:
    image: atlas-web:1.0.0
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
    environment:
      API_URL: http://api:4000/api
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?Set a separate AUTH_PROXY_SECRET for web-to-API authentication}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["127.0.0.1:8080:80"]
    restart: unless-stopped
    depends_on: [web, api]
  tls:
    image: caddy:2-alpine
    profiles: [tls]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443"]
    depends_on: [nginx]
    restart: unless-stopped
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes: [postgres_data_prod:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}",
        ]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data_prod:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-atlas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS}
    volumes: [rabbitmq_data_prod:/var/lib/rabbitmq]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
volumes:
  api_storage:
  postgres_data_prod:
  redis_data_prod:
  rabbitmq_data_prod:
  caddy_data:
  caddy_config:
